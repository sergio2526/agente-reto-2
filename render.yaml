services:
  - type: web
    name: agente-registro-contratos
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # auto = Anthropic si hay ANTHROPIC_API_KEY; si no, modo simulado (sin LLM, sin costo)
      - key: LLM_PROVIDER
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ACCESS_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-opus-5-5
      - key: LLM_EFFORT
        value: medium
      - key: MAX_ITERATIONS
        value: "25"
      - key: MAX_SESSION_TOKENS
        value: "1500000"
      - key: MAX_GLOBAL_TOKENS
        value: "20000000"
